<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameTheftAuto</title>
<link rel="stylesheet" href="globals.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="link-page">
<header class="site-header" aria-label="Primary header">
<div class="rectangle-3" aria-hidden="true"></div>
<a class="text-wrapper-20" href="/" aria-label="GameTheftAuto home">
GAMETHEFT
      </a>
<a class="text-wrapper-21" href="/" aria-label="Auto home">
AUTO
      </a>
<p class="text-wrapper-16">Shaun</p>
<nav aria-label="Primary navigation">
<a class="rectangle-6" href="/store" aria-label="Store">
<span class="text-wrapper-13">Store</span>
</a>
<a class="rectangle-4" href="/" aria-label="Home">
<span class="text-wrapper-14">Home</span>
</a>
<a class="rectangle-5" href="/about" aria-label="About">
<span class="text-wrapper-15">About</span>
</a>
</nav>
<img
        class="image-2"
        src="img/image-3.png"
        alt="Shaun profile"
      >
</header>
<main>
<img
        class="image"
        src="img/image-7.png"
        alt=""
        aria-hidden="true"
      >
<section aria-labelledby="platform-title">
<h1 id="platform-title" class="text-wrapper-17">Platform</h1>
<form role="search" aria-label="Search games">
<input
            class="rectangle-2"
            id="game-search"
            name="search"
            type="search"
            aria-label="Search games"
          >
<label class="text-wrapper-9" for="game-search">Search</label>
<img
            class="search"
            src="img/search.svg"
            alt=""
            aria-hidden="true"
          >
</form>
<div class="rectangle" aria-label="Game listings">
<div class="line" aria-hidden="true"></div>
<div class="img" aria-hidden="true"></div>
<div class="game-listing" aria-label="Persona 3 Reload listing">
<img
              class="image-3"
              src="img/image-4.png"
              alt="Persona 3 Reload cover art"
            >
<h2 class="text-wrapper">Game</h2>
<h2 class="text-wrapper-5">Year</h2>
<h2 class="text-wrapper-8">Price</h2>
<h2 class="text-wrapper-10">Region</h2>
<p class="persona-reload">Persona 3<br>Reload</p>
<p class="text-wrapper-18">2024</p>
<p class="element">$19.99<br>(-60%)</p>
<p class="text-wrapper-19">US</p>
</div>
<div class="game-listing" aria-label="Game listing">
<img
              class="image-4"
              src="img/image-8.png"
              alt="Game cover art"
            >
<h2 class="div">Game</h2>
<h2 class="text-wrapper-4">Year</h2>
<h2 class="text-wrapper-7">Price</h2>
<h2 class="text-wrapper-11">Region</h2>
</div>
<div class="game-listing" aria-label="Game listing">
<img
              class="image-5"
              src="img/image-6.png"
              alt="Game cover art"
            >
<h2 class="text-wrapper-2">Game</h2>
<h2 class="text-wrapper-3">Year</h2>
<h2 class="text-wrapper-6">Price</h2>
<h2 class="text-wrapper-12">Region</h2>
</div>
</div>
</section>
</main>
</div>
</body>
</html>
