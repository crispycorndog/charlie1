<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GAMETHEFT AUTO account login page">
  <title>Account Login | GAMETHEFT AUTO</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="GAMETHEFT AUTO home">GAMETHEFT<span>AUTO</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="store.html">Store</a>
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="cart.html">Cart</a>
      </nav>
    </div>
  </header>
  <main class="page-main">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Account Login</h1>
      <form action="#" method="get" aria-describedby="demo-note">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" aria-describedby="demo-note">Login</button>
        <p id="demo-note" class="visually-hidden">This is a front-end demonstration. Login authentication is not implemented.</p>
      </form>
    </section>
  </main>
  <footer class="site-footer"><p>&copy; 2026 GAMETHEFT AUTO. Student project.</p></footer>
</body>
</html>
