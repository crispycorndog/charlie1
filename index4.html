<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Game Theft Auto store featuring popular PC games">
<title>Game Theft Auto Store</title>
<link rel="stylesheet" href="globals.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="store-page-barron">
<div class="rectangle" aria-hidden="true"></div>
<header aria-label="Store header">
<h1 class="div">Game Theft Auto</h1>
<img
        class="image-2"
        src="img/image-3.png"
        alt="Barron McCarty profile"
        width="63"
        height="63"
      >
<nav aria-label="Primary navigation">
<a href="index.html" aria-current="page">
<div class="rectangle-2" aria-hidden="true"></div>
<span class="text-wrapper-2">Store</span>
</a>
<a href="#home">
<div class="rectangle-3" aria-hidden="true"></div>
<span class="text-wrapper-3">Home</span>
</a>
<a href="#about">
<div class="rectangle-4" aria-hidden="true"></div>
<span class="text-wrapper-4">About</span>
</a>
</nav>
</header>
<aside aria-label="Store filters">
<form>
<fieldset>
<legend class="text-wrapper-5">Top sellers</legend>
<input
            class="rectangle-5"
            id="top-sellers"
            type="checkbox"
            name="category"
            value="top-sellers"
            aria-label="Top sellers"
            checked
          >
<img class="line" src="img/line-6.svg" alt="" aria-hidden="true">
<img class="img" src="img/line-7.svg" alt="" aria-hidden="true">
</fieldset>
<fieldset>
<legend class="text-wrapper-6">Genres</legend>
<label class="text-wrapper-13" for="action">Action</label>
<input
            class="rectangle-6"
            id="action"
            type="checkbox"
            name="genre"
            value="action"
            aria-label="Action"
          >
<label class="text-wrapper-15" for="city-builder">City Builder</label>
<input
            class="rectangle-7"
            id="city-builder"
            type="checkbox"
            name="genre"
            value="city-builder"
            aria-label="City Builder"
          >
<label class="text-wrapper-16" for="horror">Horror</label>
<input
            class="rectangle-14"
            id="horror"
            type="checkbox"
            name="genre"
            value="horror"
            aria-label="Horror"
          >
<label class="text-wrapper-17" for="casual">Casual</label>
<input
            class="rectangle-15"
            id="casual"
            type="checkbox"
            name="genre"
            value="casual"
            aria-label="Casual"
          >
<label class="text-wrapper-18" for="action-2">Action</label>
<input
            class="rectangle-16"
            id="action-2"
            type="checkbox"
            name="genre"
            value="action-2"
            aria-label="Action"
          >
<label class="text-wrapper-14" for="shooter">Shooter</label>
<input
            class="rectangle-8"
            id="shooter"
            type="checkbox"
            name="genre"
            value="shooter"
            aria-label="Shooter"
          >
<img class="line-2" src="img/line-8.svg" alt="" aria-hidden="true">
<img class="line-4" src="img/line-9.svg" alt="" aria-hidden="true">
</fieldset>
<fieldset>
<legend class="text-wrapper-7">Price Range</legend>
<label class="text-wrapper-8" for="free">Free</label>
<input
            class="rectangle-13"
            id="free"
            type="checkbox"
            name="price"
            value="free"
            aria-label="Free"
          >
<label class="text-wrapper-9" for="under-10">Under $10</label>
<input
            class="rectangle-9"
            id="under-10"
            type="checkbox"
            name="price"
            value="under-10"
            aria-label="Under 10 dollars"
          >
<label class="text-wrapper-10" for="under-30">Under $30</label>
<input
            class="rectangle-10"
            id="under-30"
            type="checkbox"
            name="price"
            value="under-30"
            aria-label="Under 30 dollars"
          >
<label class="text-wrapper-11" for="under-40">Under $40</label>
<input
            class="rectangle-11"
            id="under-40"
            type="checkbox"
            name="price"
            value="under-40"
            aria-label="Under 40 dollars"
          >
<label class="text-wrapper-12" for="under-60">Under $60</label>
<input
            class="rectangle-12"
            id="under-60"
            type="checkbox"
            name="price"
            value="under-60"
            aria-label="Under 60 dollars"
          >
<img class="line-3" src="img/line-10.svg" alt="" aria-hidden="true">
<img class="line-5" src="img/line-11.svg" alt="" aria-hidden="true">
</fieldset>
</form>
</aside>
<section aria-label="Featured games">
<article aria-labelledby="persona-title">
<img
          class="image"
          src="img/image-4.png"
          alt="Persona 3 Reload game cover"
          width="270"
          height="152"
        >
<h2 class="text-wrapper-19" id="persona-title">Persona 3 Reload</h2>
<div class="element" aria-label="Persona 3 Reload price">
<del>$59.99</del><br>
<strong>$47.99</strong>
</div>
<span class="text-wrapper-26">-20%</span>
<img class="line-6" src="img/line-17.svg" alt="" aria-hidden="true">
</article>
<article aria-labelledby="gta-title">
<img
          class="image-3"
          src="img/image-14.png"
          alt="Grand Theft Auto 5 game cover"
          width="270"
          height="155"
        >
<h2 class="text-wrapper-20" id="gta-title">Grand Theft Auto 5</h2>
<div class="element-2" aria-label="Grand Theft Auto 5 price">
<del>$45.99</del><br>
<strong>$19.79</strong>
</div>
<span class="text-wrapper-27">-56%</span>
<img class="line-7" src="img/line-18.svg" alt="" aria-hidden="true">
</article>
<article aria-labelledby="counter-strike-title">
<img
          class="image-4"
          src="img/image-15.png"
          alt="Counter-Strike 2 game cover"
          width="287"
          height="164"
        >
<h2 class="text-wrapper-21" id="counter-strike-title">Counter-Strike 2</h2>
<div class="text-wrapper-25" aria-label="Counter-Strike 2 price">Free</div>
</article>
<article aria-labelledby="devil-may-cry-title">
<img
          class="image-5"
          src="img/image-16.png"
          alt="Devil May Cry 5 game cover"
          width="258"
          height="148"
        >
<h2 class="text-wrapper-22" id="devil-may-cry-title">Devil May Cry 5</h2>
<div class="element-3" aria-label="Devil May Cry 5 price">
<del>$29.99</del><br>
<strong>$7.49</strong>
</div>
<span class="text-wrapper-28">-75%</span>
<img class="line-8" src="img/line-19.svg" alt="" aria-hidden="true">
</article>
<article aria-labelledby="final-fantasy-title">
<img
          class="image-6"
          src="img/image-17.png"
          alt="Final Fantasy VII Rebirth game cover"
          width="254"
          height="143"
        >
<h2 class="text-wrapper-23" id="final-fantasy-title">Final Fantasy VII Rebirth</h2>
<div class="element-4" aria-label="Final Fantasy VII Rebirth price">
<del>$49.99</del><br>
<strong>$24.99</strong>
</div>
<span class="text-wrapper-29">-50%</span>
<img class="line-9" src="img/line-20.svg" alt="" aria-hidden="true">
</article>
<article aria-labelledby="valheim-title">
<img
          class="image-7"
          src="img/image-18.png"
          alt="Valheim game cover"
          width="240"
          height="135"
        >
<h2 class="text-wrapper-24" id="valheim-title">Valheim</h2>
<div class="element-5" aria-label="Valheim price">
<del>$29.99</del><br>
<strong>$20.99</strong>
</div>
<span class="text-wrapper-30">-30%</span>
<img class="line-10" src="img/line-21.svg" alt="" aria-hidden="true">
</article>
</section>
<footer class="text-wrapper" id="about">Barron McCarty</footer>
</main>
</body>
</html>
